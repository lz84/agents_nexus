# ============================================================
# Grever Docker Compose — Production Deployment
# Usage: docker compose up -d
# ============================================================
version: "3.8"

services:
  grever-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grever-app
    ports:
      - "${GREVER_PORT:-8097}:8097"
    volumes:
      - grever-data:/app/data
      - grever-logs:/app/logs
    environment:
      - GREVER_ENV=production
      - DATABASE_URL=sqlite:///app/data/reins.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LLM_API_KEY=${LLM_API_KEY}
      - HERMES_API_URL=${HERMES_API_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

volumes:
  grever-data:
  grever-logs:
